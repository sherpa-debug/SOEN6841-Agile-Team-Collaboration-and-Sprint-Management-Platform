# SP-5: Netlify builds and deploys every push to main.
[build]
  base = "client"
  command = "npm ci && npm test && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: serve index.html for routes such as /auth/callback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
