[build]
command = "npm ci --prefix client && npm ci --prefix server && npm test --prefix client && npm test --prefix server && npm run build --prefix client"
publish = "client/dist"

[build.environment]
NODE_VERSION = "22"

[functions]
directory = "server/netlify/functions"
node_bundler = "esbuild"
external_node_modules = ["express"]

# API requests must be handled before the SPA fallback.
[[redirects]]
from = "/api/*"
to = "/.netlify/functions/api/:splat"
status = 200
force = true

# Frontend SPA fallback.
[[redirects]]
from = "/*"
to = "/index.html"
status = 200